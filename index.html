<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>BitLock — Combo Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            teal: {
              50:  '#E1F5EE',
              100: '#9FE1CB',
              200: '#5DCAA5',
              500: '#1D9E75',
              600: '#0F6E56',
              700: '#085041',
              800: '#04342C',
            },
            ink: {
              900: '#0E1614',
              800: '#15201D',
              700: '#1D2B27',
              600: '#2A3A35',
            }
          },
          fontFamily: {
            display: ['"Fraunces"', 'ui-serif', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    .fading { opacity: 0; transition: opacity 0.2s ease; }

    html, body { height: 100%; }

    body {
      background: #F7F4EE;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0E1614; }
    }

    /* faint paper-grain texture, swaps for a soft glow in dark mode */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
      background-image: radial-gradient(circle at 1px 1px, rgba(15, 110, 86, 0.05) 1px, transparent 0);
      background-size: 18px 18px;
    }
    @media (prefers-color-scheme: dark) {
      .grain {
        opacity: 1;
        background-image:
          radial-gradient(ellipse 60% 40% at 50% -10%, rgba(93, 202, 165, 0.10), transparent 60%),
          radial-gradient(circle at 1px 1px, rgba(159, 225, 203, 0.04) 1px, transparent 0);
        background-size: auto, 18px 18px;
      }
    }

    .sticky-blur {
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* this is a touch-first surface — hide the scrollbar track entirely so
       it never reserves layout space (which made dividers stop short of the
       edge and caused width jumps when toggling between tabs of very
       different lengths). Scrolling still works fine via touch/trackpad. */
    #main { scrollbar-width: none; -ms-overflow-style: none; }
    #main::-webkit-scrollbar { display: none; }

    /* segmented filter control */
    .seg-track {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
    }
    .seg-btn {
      transition: color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(15, 110, 86, 0.18); border-radius: 999px; }
    @media (prefers-color-scheme: dark) {
      ::-webkit-scrollbar-thumb { background: rgba(93, 202, 165, 0.18); }
    }
  </style>
</head>
<body class="text-ink-900 dark:text-teal-50 antialiased">
  <div class="grain"></div>

  <div class="relative z-[1] max-w-lg mx-auto h-[100dvh] flex flex-col">

    <!-- Loading -->
    <div id="loading-screen" class="flex-1 flex flex-col items-center justify-center text-ink-900/40 dark:text-teal-50/40">
      <svg class="animate-spin w-6 h-6 mb-2" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
      </svg>
      <span class="text-sm font-mono tracking-wide">Loading shared progress…</span>
    </div>

    <!-- Main: one scroll container — title/stats scroll away, sticky zone pins at top -->
    <div id="main" class="hidden flex-1 min-h-0 overflow-y-auto">

      <!-- Header zone (title, stats, progress) — scrolls away -->
      <div>
        <div class="px-5 pt-6 pb-4">
          <div class="flex items-baseline gap-2.5">
            <h1 class="text-2xl font-display font-semibold tracking-tight">BitLock</h1>
            <span class="text-xs font-mono uppercase tracking-[0.18em] text-ink-900/40 dark:text-teal-50/40">10-button combo tracker</span>
          </div>
          <p class="text-xs text-ink-900/45 dark:text-teal-50/40 mt-1">Shared progress · tap to mark combos tried</p>
        </div>

        <!-- Stats -->
        <div class="flex gap-2 px-5 pb-3">
          <div class="flex-1 bg-white/70 dark:bg-ink-700/60 ring-1 ring-ink-900/[0.06] dark:ring-teal-50/10 rounded-xl px-3.5 py-2.5">
            <div class="text-[10px] font-mono uppercase tracking-[0.16em] text-ink-900/40 dark:text-teal-50/40">Tried</div>
            <div class="text-xl font-display font-medium mt-0.5" id="stat-tried">0</div>
          </div>
          <div class="flex-1 bg-white/70 dark:bg-ink-700/60 ring-1 ring-ink-900/[0.06] dark:ring-teal-50/10 rounded-xl px-3.5 py-2.5">
            <div class="text-[10px] font-mono uppercase tracking-[0.16em] text-ink-900/40 dark:text-teal-50/40">Remaining</div>
            <div class="text-xl font-display font-medium mt-0.5" id="stat-left">1024</div>
          </div>
          <div class="flex-1 bg-white/70 dark:bg-ink-700/60 ring-1 ring-ink-900/[0.06] dark:ring-teal-50/10 rounded-xl px-3.5 py-2.5">
            <div class="text-[10px] font-mono uppercase tracking-[0.16em] text-ink-900/40 dark:text-teal-50/40">Progress</div>
            <div class="text-xl font-display font-medium mt-0.5" id="stat-pct">0%</div>
          </div>
        </div>

        <!-- Progress bar -->
        <div class="mx-5 mb-1 h-1.5 bg-ink-900/[0.06] dark:bg-teal-50/10 rounded-full overflow-hidden">
          <div id="prog-fill" class="h-full bg-gradient-to-r from-teal-500 to-teal-200 dark:from-teal-600 dark:to-teal-200 rounded-full transition-all duration-500" style="width:0%"></div>
        </div>
      </div>

      <!-- Sticky zone: stays pinned while the list scrolls beneath it -->
      <div class="shrink-0 sticky top-0 z-10 sticky-blur bg-[#F7F4EE]/85 dark:bg-[#0E1614]/80 border-t border-b border-ink-900/[0.06] dark:border-teal-50/10">
        <div class="pt-3">

          <!-- Next up banner -->
          <div id="next-banner" class="mx-5 mb-3 px-4 py-3 bg-teal-50 dark:bg-teal-500/[0.12] ring-1 ring-teal-500/20 dark:ring-teal-200/20 rounded-xl flex items-center gap-3">
            <div class="flex-1 min-w-0">
              <div class="text-[10px] font-mono uppercase tracking-[0.16em] text-teal-600 dark:text-teal-200/80 mb-0.5">Next up</div>
              <div id="next-combo-display" class="text-lg font-medium text-teal-800 dark:text-teal-50 font-mono tracking-wide"></div>
            </div>
            <button id="mark-next-btn"
              class="shrink-0 px-4 py-2.5 bg-teal-500 dark:bg-teal-200 text-white dark:text-ink-900 text-sm font-medium rounded-lg active:bg-teal-600 dark:active:bg-teal-100 transition-colors">
              Mark tried
            </button>
          </div>

          <!-- Search -->
          <div class="px-5 mb-3">
            <input id="search" type="text" placeholder="Search buttons e.g. 3-7…"
              autocomplete="off" autocorrect="off" autocapitalize="off"
              class="w-full px-3.5 py-2.5 text-base bg-white/70 dark:bg-ink-700/60 placeholder:text-ink-900/35 dark:placeholder:text-teal-50/30 ring-1 ring-ink-900/[0.08] dark:ring-teal-50/10 rounded-lg outline-none focus:ring-2 focus:ring-teal-500/40 dark:focus:ring-teal-200/40 transition-all" />
          </div>

          <!-- Filter toggle -->
          <div class="px-5 mb-2">
            <div class="seg-track bg-ink-900/[0.05] dark:bg-teal-50/[0.06] rounded-xl">
              <button data-filter="all" id="tab-all"
                class="tab-btn seg-btn py-2.5 text-sm text-center rounded-lg text-ink-900/50 dark:text-teal-50/50">
                All (1024)
              </button>
              <button data-filter="untried" id="tab-untried"
                class="tab-btn seg-btn py-2.5 text-sm text-center rounded-lg bg-teal-500 dark:bg-teal-200 text-white dark:text-ink-900 font-medium shadow-sm">
                Untried
              </button>
              <button data-filter="tried" id="tab-tried"
                class="tab-btn seg-btn py-2.5 text-sm text-center rounded-lg text-ink-900/50 dark:text-teal-50/50">
                Tried (0)
              </button>
            </div>
          </div>

          <!-- Sync status -->
          <div id="sync-status" class="text-right px-5 text-[11px] font-mono text-ink-900/30 dark:text-teal-50/25 pb-1.5"></div>
        </div>
      </div>

      <!-- Combo list — part of the same scroll flow as the rest of the page -->
      <div id="combo-list" class="px-5 pb-6 divide-y divide-ink-900/[0.06] dark:divide-teal-50/[0.06]"></div>

    </div>
  </div>

  <script>
    const TOTAL = 1024;
    const SYNC_INTERVAL = 5000;
    let triedSet = new Set();
    let triedTimestamps = {};
    let allCombos = [];
    let filter = 'untried';
    let searchQuery = '';
    let filteredCombos = [];
    const PAGE_SIZE = 40;
    let rendered = 0;

    function genCombos() {
      const result = [];
      for (let i = 0; i < TOTAL; i++) {
        const bits = [];
        for (let b = 0; b < 10; b++) {
          if ((i >> b) & 1) bits.push(b + 1);
        }
        result.push({ id: i, buttons: bits, count: bits.length });
      }
      result.sort((a, b) => {
        if (a.count !== b.count) return a.count - b.count;
        for (let i = 0; i < Math.min(a.buttons.length, b.buttons.length); i++) {
          if (a.buttons[i] !== b.buttons[i]) return a.buttons[i] - b.buttons[i];
        }
        return a.buttons.length - b.buttons.length;
      });
      return result;
    }

    function fmtTime(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function updateStats() {
      const tried = triedSet.size;
      const pct = Math.round((tried / TOTAL) * 100);
      document.getElementById('stat-tried').textContent = tried;
      document.getElementById('stat-left').textContent = TOTAL - tried;
      document.getElementById('stat-pct').textContent = pct + '%';
      document.getElementById('prog-fill').style.width = pct + '%';
    }

    function getNextUntried() {
      return allCombos.find(c => !triedSet.has(c.id)) || null;
    }

    function showNextBanner() {
      const next = getNextUntried();
      const banner = document.getElementById('next-banner');
      if (next) {
        document.getElementById('next-combo-display').textContent =
          next.buttons.length === 0 ? '(no buttons)' : next.buttons.join(' · ');
        banner.classList.remove('hidden');
        document.getElementById('mark-next-btn').onclick = () => markTried(next.id);
      } else {
        banner.innerHTML = `<div class="flex-1 text-center text-teal-600 dark:text-teal-200 font-medium text-sm">🏆 All combos tried!</div>`;
      }
    }

    function makeComboItem(combo) {
      const tried = triedSet.has(combo.id);
      const ts = triedTimestamps[combo.id];

      const div = document.createElement('div');
      div.className = 'flex items-center gap-3 py-2.5';
      div.dataset.id = combo.id;

      const left = document.createElement('div');
      left.className = 'flex flex-col gap-1 flex-1 min-w-0';

      const pillRow = document.createElement('div');
      pillRow.className = 'flex flex-wrap gap-1';

      if (combo.buttons.length === 0) {
        const pill = document.createElement('div');
        pill.className = `px-2 h-8 flex items-center rounded-lg text-xs font-medium border ${
          tried
            ? 'bg-teal-500 dark:bg-teal-200 border-teal-500 dark:border-teal-200 text-white dark:text-ink-900'
            : 'bg-white/60 dark:bg-ink-700/50 border-ink-900/10 dark:border-teal-50/10 text-ink-900/60 dark:text-teal-50/50'
        }`;
        pill.textContent = 'none';
        pillRow.appendChild(pill);
      } else {
        combo.buttons.forEach(b => {
          const pill = document.createElement('div');
          pill.className = `w-8 h-8 flex items-center justify-center rounded-full text-xs font-mono font-medium border ${
            tried
              ? 'bg-teal-500 dark:bg-teal-200 border-teal-500 dark:border-teal-200 text-white dark:text-ink-900'
              : 'bg-white/60 dark:bg-ink-700/50 border-ink-900/10 dark:border-teal-50/10 text-ink-900/70 dark:text-teal-50/60'
          }`;
          pill.textContent = b;
          pillRow.appendChild(pill);
        });
      }
      left.appendChild(pillRow);

      if (tried && ts) {
        const meta = document.createElement('div');
        meta.className = 'text-xs font-mono text-ink-900/35 dark:text-teal-50/30';
        meta.textContent = 'Tried ' + fmtTime(ts);
        left.appendChild(meta);
      }

      const markBtn = document.createElement('button');
      markBtn.className = `shrink-0 min-w-[88px] px-3 py-2.5 text-sm rounded-lg border transition-colors active:scale-95 ${
        tried
          ? 'bg-red-50 dark:bg-red-500/10 border-red-200 dark:border-red-400/30 text-red-700 dark:text-red-300'
          : 'bg-teal-50 dark:bg-teal-500/10 border-teal-200 dark:border-teal-400/30 text-teal-700 dark:text-teal-200'
      }`;
      markBtn.textContent = tried ? 'Undo' : 'Mark tried';
      markBtn.addEventListener('click', () => tried ? unmarkTried(combo.id) : markTried(combo.id));

      div.appendChild(left);
      div.appendChild(markBtn);
      return div;
    }

    function getFiltered() {
      let base = allCombos;
      if (filter === 'tried') base = base.filter(c => triedSet.has(c.id));
      if (filter === 'untried') base = base.filter(c => !triedSet.has(c.id));
      if (searchQuery) {
        const nums = searchQuery.split(/[-,\s]+/).map(Number).filter(n => n >= 1 && n <= 10);
        if (nums.length > 0) base = base.filter(c => nums.every(n => c.buttons.includes(n)));
      }
      return base;
    }

    function renderList(reset = true) {
      const list = document.getElementById('combo-list');
      if (reset) {
        filteredCombos = getFiltered();
        rendered = 0;
        list.innerHTML = '';
        if (filteredCombos.length === 0) {
          list.innerHTML = '<div class="py-8 text-center text-sm text-ink-900/35 dark:text-teal-50/30">No combos match.</div>';
          return;
        }
      }
      const chunk = filteredCombos.slice(rendered, rendered + PAGE_SIZE);
      chunk.forEach(c => list.appendChild(makeComboItem(c)));
      rendered += chunk.length;
    }

    function updateTabs() {
      const tried = triedSet.size;
      const tabs = {
        all: `All (${TOTAL})`,
        untried: `Untried (${TOTAL - tried})`,
        tried: `Tried (${tried})`,
      };
      document.querySelectorAll('.tab-btn').forEach(t => {
        const f = t.dataset.filter;
        t.textContent = tabs[f];
        const active = f === filter;
        t.className = `tab-btn seg-btn py-2.5 text-sm text-center rounded-lg ${
          active
            ? 'bg-teal-500 dark:bg-teal-200 text-white dark:text-ink-900 font-medium shadow-sm'
            : 'text-ink-900/50 dark:text-teal-50/50'
        }`;
      });
    }

    function setSyncStatus(msg) {
      document.getElementById('sync-status').textContent = msg;
    }

    async function fetchState() {
      const res = await fetch('/api/state');
      if (!res.ok) throw new Error('fetch failed');
      return res.json();
    }

    async function postMark(id, timestamp, undo = false) {
      const res = await fetch('/api/mark', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, timestamp, undo }),
      });
      if (!res.ok) throw new Error('mark failed');
      return res.json();
    }

    async function loadState(silent = false) {
      try {
        const data = await fetchState();
        triedSet = new Set((data.tried || []).map(Number));
        triedTimestamps = data.timestamps || {};
        if (!silent) setSyncStatus('Synced · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      } catch (e) {
        if (!silent) setSyncStatus('Failed to sync');
      }
    }

    async function markTried(id) {
      const ts = Date.now();
      triedSet.add(id);
      triedTimestamps[id] = ts;
      updateStats(); updateTabs(); showNextBanner();
      const item = document.querySelector(`[data-id="${id}"]`);
      if (item) {
        if (filter === 'untried') {
          item.classList.add('fading');
          setTimeout(() => { item.remove(); filteredCombos = getFiltered(); }, 220);
        } else {
          item.replaceWith(makeComboItem(allCombos.find(c => c.id === id)));
        }
      }
      try {
        await postMark(id, ts, false);
        setSyncStatus('Saved · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      } catch (e) { setSyncStatus('Save failed'); }
    }

    async function unmarkTried(id) {
      triedSet.delete(id);
      delete triedTimestamps[id];
      updateStats(); updateTabs(); showNextBanner();
      const item = document.querySelector(`[data-id="${id}"]`);
      if (item) {
        if (filter === 'tried') {
          item.classList.add('fading');
          setTimeout(() => { item.remove(); filteredCombos = getFiltered(); }, 220);
        } else {
          item.replaceWith(makeComboItem(allCombos.find(c => c.id === id)));
        }
      }
      try {
        await postMark(id, null, true);
        setSyncStatus('Saved · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      } catch (e) { setSyncStatus('Save failed'); }
    }

    async function backgroundSync() {
      const before = triedSet.size;
      await loadState(true);
      if (triedSet.size !== before) {
        updateStats(); updateTabs(); showNextBanner(); renderList();
        setSyncStatus('Auto-synced · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      }
    }

    async function init() {
      allCombos = genCombos();
      await loadState();
      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('main').classList.remove('hidden');
      updateStats(); updateTabs(); showNextBanner(); renderList();

      document.getElementById('main').addEventListener('scroll', function () {
        if (this.scrollTop + this.clientHeight >= this.scrollHeight - 100 && rendered < filteredCombos.length) {
          renderList(false);
        }
      });

      document.getElementById('search').addEventListener('input', e => {
        searchQuery = e.target.value.trim();
        renderList();
      });

      document.querySelectorAll('.tab-btn').forEach(t => {
        t.addEventListener('click', () => { filter = t.dataset.filter; updateTabs(); renderList(); });
      });

      setInterval(backgroundSync, SYNC_INTERVAL);
    }

    init();
  </script>
</body>
</html>
